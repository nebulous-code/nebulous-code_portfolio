# Content validation for nebulouscode.com
#
# Why this is a separate workflow:
#   This gate is deliberately NOT on the release path. scheduled-rebuild.yml
#   fires every 6 hours and triggers a Render deploy; it does not consult this
#   workflow and never will. So a mistyped category fails here and nothing
#   else, and a failed deploy is never mistaken for a content problem.
#
#   A post with a bad category still publishes on time. The build logs a
#   [blog] warning, this check goes red, and you fix it whenever you like.
#
# What it checks:
#   - blog frontmatter: required fields, parseable dates, known category,
#     known languages, a `project` that matches src/config/projects.ts, and
#     unique slugs (the URL comes from the filename)
#   - the whole project typechecks
#
# Node 22 is required for --experimental-strip-types, which lets the validator
# import the real vocabularies from src/config instead of restating them.
# Render pins Node 20 but never runs this.

name: validate-content

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate blog frontmatter
        run: npm run validate:content

      - name: Typecheck
        run: npx astro check
